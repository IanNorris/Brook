# Brook file type associations
# Format: extension=path_to_binary
# The file browser (brook-files) reads this at startup.
# When you open a file, it fork+execs the associated app with the filepath.

# Text files
txt=/nix/bin/brook-edit
md=/nix/bin/brook-edit
cfg=/nix/bin/brook-edit
conf=/nix/bin/brook-edit
rc=/nix/bin/brook-edit
log=/nix/bin/brook-edit
ini=/nix/bin/brook-edit
json=/nix/bin/brook-edit
xml=/nix/bin/brook-edit
csv=/nix/bin/brook-edit
sh=/nix/bin/brook-edit

# Source code
c=/nix/bin/brook-edit
h=/nix/bin/brook-edit
cpp=/nix/bin/brook-edit
hpp=/nix/bin/brook-edit
py=/nix/bin/brook-edit
js=/nix/bin/brook-edit
rs=/nix/bin/brook-edit
lua=/nix/bin/brook-edit
nix=/nix/bin/brook-edit
s=/nix/bin/brook-edit
S=/nix/bin/brook-edit
asm=/nix/bin/brook-edit
ld=/nix/bin/brook-edit
mk=/nix/bin/brook-edit

# Video
mp4=/nix/bin/brook-player
avi=/nix/bin/brook-player
mkv=/nix/bin/brook-player
webm=/nix/bin/brook-player
mov=/nix/bin/brook-player
flv=/nix/bin/brook-player
wmv=/nix/bin/brook-player
m4v=/nix/bin/brook-player

# Audio
