// Repeat the two shipped demos, printing a timedemo result at each boundary.
// Explicit disconnect is needed: the normal nextserver loop stays connected.
// Launch with +set timedemo 1 +exec brook-benchmark.cfg for uncapped timing,
// or +set timedemo 0 +exec brook-benchmark.cfg for moving-scene profiling.
// Keep this opt-in benchmark advancing during visible/minimized comparisons.
// Yamagi's default pauses on focus loss without automatically resuming.
set vid_pauseonfocuslost 1
set paused 0
alias brook_bench1 "disconnect; demomap demo1.dm2; set nextserver brook_bench2"
alias brook_bench2 "disconnect; demomap demo2.dm2; set nextserver brook_bench1"
brook_bench1
